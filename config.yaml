# Keeping the central configuration for Data Wizardry in Hogwarts here.
# Every date, path, threshold and parameter I use in this project lives in
# this file. None of my scripts may hard code any of these values.

project:
  name: data-wizardry-in-hogwarts
  reporting_currency: CAD          # Reporting in CAD because my client is Canadian
  random_seed: 42
  user_agent: "data-wizardry-in-hogwarts/1.0 (MBAI student project; contact via repository)"

dates:
  premiere: 2026-12-25             # Fixing the premiere date, the event my whole project plans around
  pageviews_start: 2015-07-01      # Starting where the Wikimedia daily article data begins
  pageviews_end: 2026-09-01        # Ending on the date of my project plan, when I verified my sources
  forecast_horizon_months: 12      # Forecasting at least twelve months past the premiere
  gift_season_start: 2026-11-01
  january_position_end: 2027-01-31

paths:
  data_raw: data/raw
  data_cleaned: data/cleaned
  data_processed: data/processed
  data_external: data/external
  images: images
  figures: images/figures
  images_dashboard: images/dashboard
  images_infographic: images/infographic
  outputs_tables: outputs/tables
  outputs_models: outputs/models
  docs: docs
  logs: logs
  dashboard: dashboard
  infographic: infographic

sources:
  potterdb:
    base_url: https://api.potterdb.com/v1
    # Collecting chapters separately, because they are not a top level
    # endpoint. They hang off each book as /v1/books/<slug>/chapters. I
    # verified this on 2 September 2026. The flat /v1/chapters path returns 404.
    endpoints: [books, characters, movies, spells, potions]
    page_size: 100                 # Using 100 because it is accepted and cuts 217 calls to 55
    rate_limit_per_hour: 900       # Keeping to the API limit of 900 calls an hour, which is 15 a minute
    min_seconds_between_calls: 4.0
  hpapi:
    base_url: https://hp-api.onrender.com/api
    endpoints: [characters, spells]
  pageviews:
    base_url: https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article
    project: en.wikipedia
    access: all-access
    agent: all-agents
    granularity: daily
    min_seconds_between_calls: 0.2
    # Listing the Wikipedia article titles, grouped by what they measure. Each
    # title must match the live article exactly. A redirect returns no data and
    # no error. So when an article returns nothing, I log it as a data issue
    # and drop it. I do not quietly treat it as zero attention.
    articles:
      franchise:
        - Harry_Potter
        - Wizarding_World
        - Harry_Potter_(film_series)
        - Fantastic_Beasts
      series:
        - Harry_Potter_(TV_series)
        - HBO_Max
      films:
        - Harry_Potter_and_the_Philosopher's_Stone_(film)
        - Harry_Potter_and_the_Chamber_of_Secrets_(film)
        - Harry_Potter_and_the_Prisoner_of_Azkaban_(film)
        - Harry_Potter_and_the_Goblet_of_Fire_(film)
        - Harry_Potter_and_the_Order_of_the_Phoenix_(film)
        - Harry_Potter_and_the_Half-Blood_Prince_(film)
        - Harry_Potter_and_the_Deathly_Hallows_–_Part_1
        - Harry_Potter_and_the_Deathly_Hallows_–_Part_2
        - Fantastic_Beasts_and_Where_to_Find_Them_(film)
        - Fantastic_Beasts:_The_Crimes_of_Grindelwald
        - Fantastic_Beasts:_The_Secrets_of_Dumbledore
      characters:
        - Harry_Potter_(character)
        - Hermione_Granger
        - Ron_Weasley
        - Albus_Dumbledore
        - Severus_Snape
        - Lord_Voldemort
        - Draco_Malfoy
        - Rubeus_Hagrid
        - Sirius_Black
        - Minerva_McGonagall
        - Bellatrix_Lestrange
        - Luna_Lovegood
        - Neville_Longbottom
        - Ginny_Weasley
        - Dobby_(Harry_Potter)
        - Remus_Lupin
      control:
        # Adding comparison franchises, so I do not mistake a general seasonal
        # rise in attention for a Harry Potter one. They match my Trends keyword
        # group D further down.
        - The_Lord_of_the_Rings
        - Star_Wars
        - The_Chronicles_of_Narnia
        - Percy_Jackson
    # Mapping each Wikipedia article to its PotterDB character slug. I wrote the
    # map by hand because the two sources name people differently and no
    # automatic rule joins them safely. Wikipedia uses the common name ("Ron
    # Weasley", "Lord Voldemort"). PotterDB uses the canonical one ("Ronald
    # Bilius Weasley", "Tom Marvolo Riddle"). Matching on a normalised name
    # misses nine of the sixteen. A looser match starts pairing "Sirius Black"
    # with his grandfather, who is a different character in a different house.
    # Sixteen plain lines that a reader can check are better than a clever rule
    # that is wrong in ways nobody notices. I use the slug and not the name
    # because the slug is ASCII and stable, while several names carry an
    # accented "née".
    character_article_to_potterdb_slug:
      Harry_Potter_(character): harry-potter
      Hermione_Granger: hermione-granger
      Ron_Weasley: ronald-weasley
      Albus_Dumbledore: albus-dumbledore
      Severus_Snape: severus-snape
      Lord_Voldemort: tom-riddle
      Draco_Malfoy: draco-malfoy
      Rubeus_Hagrid: rubeus-hagrid
      Sirius_Black: sirius-black          # Pointing to Sirius Black III, Harry's godfather
      Minerva_McGonagall: minerva-mcgonagall
      Bellatrix_Lestrange: bellatrix-lestrange
      Luna_Lovegood: luna-lovegood
      Neville_Longbottom: neville-longbottom
      Ginny_Weasley: ginevra-weasley
      Dobby_(Harry_Potter): dobby
      Remus_Lupin: remus-lupin
  trends:
    library: trendspy               # Using trendspy because pytrends is archived and broken
    geos: ["", "CA"]                # Pulling worldwide and Canada
    timeframe: "2004-01-01 2026-09-01"
    request_delay_seconds: 12       # Waiting 12 seconds because Trends throttles hard and slow is the only way through
    max_terms_per_group: 5          # Limiting to five because a Trends comparison accepts no more than five
    anchor_term: "harry potter"     # Putting this term in every group so I can compare the groups
    # Pulling the series twice, because Google picks the granularity from the
    # length of the window and I cannot ask for one. A request longer than
    # about five years comes back monthly. I verified this on 2 September 2026:
    # 2004-01-01 to 2026-09-01 returned 273 monthly points, not weeks. The full
    # range gives monthly data, the long history my seasonality work needs.
    # The short windows give weekly data, the detail I planned to use for
    # timing. The windows overlap so my cleaning step can rescale them onto one
    # series with the ratio of the overlapping months. A value of 100 in one
    # window does not mean the same as 100 in the next.
    weekly_window_years: 4
    weekly_window_step_years: 3     # Stepping a four year window every three years, which gives one year of overlap
    weekly_groups:                  # Listing only the groups my timing argument needs
      - a_franchise
      - b_product_intent
    keyword_groups:
      # Putting the same anchor term in all four groups, because each group is
      # scaled to its own maximum. Without it, a value of 60 in group A and a
      # value of 60 in group C would mean different things and I could not
      # compare them.
      a_franchise:
        - harry potter
        - wizarding world
        - harry potter tv series
        - hbo max
      b_product_intent:
        - harry potter
        - harry potter gift
        - harry potter book set
        - harry potter costume
        - harry potter lego
      c_characters:
        - harry potter
        - hermione granger
        - severus snape
        - draco malfoy
        - dumbledore
      d_control:
        # Adding comparison franchises. If all five rise together in November,
        # the rise is Christmas, not the wizarding revival.
        - harry potter
        - lord of the rings
        - star wars
        - percy jackson
        - narnia
  statcan:
    base_url: https://www150.statcan.gc.ca/t1/wds/rest
    # Collecting two retail tables. I checked them against the live cube list
    # on 2 September 2026. I expected one retail table to be archived, and it
    # is: 20-10-0008 stopped in December 2022. I can still download it and it is
    # the only way to reach back before 2017. So I collect both tables and my
    # cleaning step chains them on their 2017 to 2022 overlap. Both have the
    # same geography and NAICS dimensions, which is why I can defend the chain.
    tables:
      retail_current:
        product_id: 20100056
        table_number: "20-10-0056-01"
        title: Monthly retail trade sales by province and territory
        status: active
        coverage: 2017-01 to 2026-06
      retail_historical:
        product_id: 20100008
        table_number: "20-10-0008-01"
        title: Retail trade sales by province and territory
        status: archived December 2022, retained for history before 2017
        coverage: 1991-01 to 2022-12
      cpi:
        product_id: 18100004
        table_number: "18-10-0004-01"
        title: Consumer Price Index, monthly, not seasonally adjusted
        status: active
        coverage: 1914-01 to 2026-07
        # Fetching one series and not the whole table. The bulk download is
        # 162MB and covers 30 geographies and 359 product groups. My project
        # uses one combination: Canada, All-items. That is 1,351 rows, or 0.12
        # per cent of the bulk file.
        # The coordinate points to one cell of the cube. The positions are
        # Geography then Products, and the trailing zeros pad it to the ten
        # dimensions the API always expects. Member 2 is Canada and member 2 is
        # All-items. I read both from the cube metadata and did not guess them.
        # There is a real trade here. The bulk file needs no identifier and
        # cannot go stale, but this coordinate breaks if Statistics Canada
        # renumbers a member. 05_statcan.py falls back to the bulk download if
        # the series request fails, so a renumbering costs disk space and not
        # the run.
        mode: series
        coordinate: "2.2.0.0.0.0.0.0.0.0"
        geography_member: Canada
        product_member: All-items
        max_periods: 1500
    geography: Canada
    # Using NAICS 459A as the closest published match to a book and lifestyle
    # retailer. 44-45 is total retail trade, my control for general seasonality.
    # Without it, I cannot tell a November rise in the category apart from
    # Christmas happening to every shop in the country.
    naics_focus: "459A"
    naics_focus_name: "Sporting goods, hobby, musical instrument, book retailers and news dealers"
    naics_control: "44-45"
    cpi_products: ["All-items"]
    adjustment: "Unadjusted"    # Keeping the data unadjusted, because I must measure seasonality, not remove it first
    # Mapping each old NAICS code to the new one. The archived table is coded to
    # NAICS 2017 and the active one to NAICS 2022, so the same shop sits under a
    # different code on each side of the join. Without this map, the category
    # my project is about would have no history before 2017 at all. The
    # chaining step then measures, on the six year overlap, how well the two
    # really agree. So I report the quality of each mapping and do not assume
    # it. Codes that are not in this map were not renumbered and carry across
    # unchanged.
    naics_crosswalk_2017_to_2022:
      "451": "459A"     # Mapping sporting goods, hobby, book and music stores to sporting goods, hobby, musical instrument, book retailers and news dealers
      "452": "455"      # Mapping general merchandise stores to general merchandise retailers
      "453": "459B"     # Mapping miscellaneous store retailers to miscellaneous retailers
      "446": "456"      # Mapping health and personal care
      "447": "457"      # Mapping gasoline stations to gasoline stations and fuel vendors
      "448": "458"      # Mapping clothing and clothing accessories
      "4481": "4581"
      "4482": "4582"
      "4483": "4583"
      "44512": "44513"  # Mapping convenience stores to convenience retailers and vending machine operators
    # Leaving out 442 and 443 on purpose. They were merged into 449 in the 2022
    # revision, and I cannot write a merge as a one to one map. So 449 simply
    # starts in 2017. Nothing in my project depends on them.
  toys:
    rebrickable_base_url: https://rebrickable.com/api/v3/lego
    brickset_base_url: https://brickset.com/api/v3.asmx
    theme_keyword: "harry potter"
    year_from: 2001
    year_to: 2026
  reddit:
    subreddits: [harrypotter, HPfanfiction, Fantasy, boxoffice]
    post_limit_per_subreddit: 1000

films:
  # Listing the eleven theatrical films that have measurable performance data.
  # My rule: I never fit a predictive model on these rows. Eleven rows are too
  # few for that, so I only describe them.
  titles:
    - "Harry Potter and the Philosopher's Stone"
    - "Harry Potter and the Chamber of Secrets"
    - "Harry Potter and the Prisoner of Azkaban"
    - "Harry Potter and the Goblet of Fire"
    - "Harry Potter and the Order of the Phoenix"
    - "Harry Potter and the Half-Blood Prince"
    - "Harry Potter and the Deathly Hallows - Part 1"
    - "Harry Potter and the Deathly Hallows - Part 2"
    - "Fantastic Beasts and Where to Find Them"
    - "Fantastic Beasts: The Crimes of Grindelwald"
    - "Fantastic Beasts: The Secrets of Dumbledore"

events:
  # Listing the dated events I use as regressors in the forecast and as my
  # validation check for it. I only list events that can be verified from
  # outside and that show up in my collected data. An event nobody can see in
  # the series is not evidence of anything.
  - name: first_teaser_trailer
    date: 2026-03-25
    description: >
      First teaser trailer released and the 25 December 2026 premiere date
      announced. Wikipedia views of the series article went from about 3,000 a
      day to 135,314 on 26 March, a factor of forty four, decaying over roughly
      a week to a new floor about four times the old one. This is the event the
      forecast is validated against: a model that cannot reproduce a step of
      this shape has no business predicting the premiere.
    source: observed in data/cleaned/pageviews, confirmed by press coverage dated 25-26 March 2026
    expected_effect: large transient spike plus a permanent level shift

eras:
  # Setting the eras used by the dashboard slicers and by several charts.
  original: [2001, 2011]
  middle: [2012, 2022]
  revival: [2023, 2027]

modelling:
  test_size_weeks: 52              # Holding out this period for the interest forecast
  # Using five folds, not three. The smallest usable spell class holds ten
  # examples, so at three folds each test fold sees about three of them and the
  # per class recall is mostly noise. Five folds leave more in training, which
  # matters more than test fold size when classes are this thin. This was 3 in
  # config while my classifier hard coded 5. That is the silent mismatch this
  # file should prevent. The code now reads this value, and 5 is the value I
  # chose after thinking it through.
  cv_folds: 5
  scenarios: [low, central, high]
  max_interest_to_sales_lag_months: 3
  clustering:
    k_range: [2, 3, 4, 5, 6, 7, 8]
    silhouette_min: 0.15

retail:
  service_level: 0.95              # Using my default, stated as an assumption
  lead_time_days:
    imported: 120                  # Counting sea freight from Asia plus port and DC handling
    domestic: 45
    reprinted_books: 75
  review_period_days: 30
  gross_margin_rate: 0.42          # Setting the category gross margin on branded licensed product
  markdown_rate: 0.40              # Setting the average markdown taken to clear unsold seasonal stock
  holding_cost_rate_annual: 0.25   # Counting capital, space and shrink as a share of unit cost
  lost_sale_goodwill_multiplier: 1.15
  january_reserve_proportions: [0.0, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70]
  # Splitting December, because the premiere falls on 25 December, inside a
  # month. A monthly demand profile cannot separate the gift window from the
  # time after the premiere without this split. No daily Canadian category
  # series is published, so this share is my stated assumption and not a
  # measurement. I set it high because December category sales are gift
  # purchases, and gift buying stops on Christmas Day. The measured category
  # index peaks at 172 in December and drops to 86 in January. That only fits
  # if most December volume lands before the 25th. I test my recommendation
  # against this value in the sensitivity table.
  december_share_before_premiere: 0.85
  store_count: 190                 # Modelling a composite Canadian book and lifestyle chain
  category_baseline_sales_cad: 4200000   # Assuming this annual baseline for wizarding category sales
  average_unit_retail_cad: 34.0    # Blending the retail price across books, gift and toy lines
  # Setting how much of a rise in franchise attention shows up as a rise in
  # category sales. This is my assumption, not a measurement, and it is the
  # one number my whole recommendation is most sensitive to.
  # Module 5.2 tried to measure it and could not. The elasticity of NAICS 459A
  # sales to franchise attention was 0.05, with a confidence interval that
  # spans zero (p = 0.07). That is not evidence of no effect. It shows that a
  # national category with every bookshop and hobby shop in Canada is too
  # coarse a tool to detect one franchise inside it. I will not pretend that a
  # not significant coefficient is a measurement. So I declare the conversion
  # here as an assumption and report my recommendation across the range.
  attention_pass_through: 0.35
  attention_pass_through_range: [0.15, 0.25, 0.35, 0.50, 0.70]

bigdata:
  corpus_sizes: [50000, 200000, 800000]
  engines: [pandas, dask, pyspark]

ethics:
  hash_salt_env_var: REDDIT_HASH_SALT
  drop_usernames: true
  min_aggregate_group_size: 20
