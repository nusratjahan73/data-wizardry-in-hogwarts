# Setting my lint rules. I run ruff before every commit, so I write the rule
# set down here. I do not leave it to the defaults of whatever version is
# installed.

line-length = 110
target-version = "py311"

[lint]
select = [
    "E",    # Checking pycodestyle errors
    "F",    # Checking pyflakes: unused imports, undefined names
    "I",    # Sorting imports
    "UP",   # Using pyupgrade for modern syntax
    "B",    # Catching likely bugs with bugbear
    "SIM",  # Simplifying code
    "RUF",  # Applying ruff's own rules
    "DTZ",  # Flagging naive datetime use
    "BLE",  # Flagging blind except
]

ignore = [
    # Ignoring these rules on purpose. I explain each one at its place in the
    # code. BLE001: three of my collection scripts catch bare Exception on
    # purpose. trendspy and praw both raise a wide and undocumented range of
    # network and parsing errors. When a source fails, I want the build to log
    # the failure and go on to the next source, not stop. If I caught only the
    # exceptions those libraries document today, a new one would crash a four
    # hour collection run.
    "BLE001",
    # Ignoring DTZ011: I use date.today() for "is this date in the future"
    # checks. The dates I compare against are calendar dates with no timezone.
    # Adding a timezone to one side of that comparison would be precision my
    # data does not have. A monthly retail figure has no time of day.
    "DTZ011",
    "DTZ007",
    # Ignoring E501: almost all of my long lines are docstrings and explaining
    # comments. Breaking a sentence to fit a column limit makes it harder to
    # read.
    "E501",
    # Ignoring RUF001: I use the en dash in 10_clean_potterdb.py on purpose.
    # PotterDB writes budget ranges as "150–200 million" with an en dash. My
    # parser has to match the character the source really uses, not the one
    # that looks safer.
    "RUF001",
]

[lint.per-file-ignores]
# Allowing E402 in my scripts. I number them so that filename order is run
# order. That means module names begin with a digit and are never imported as
# modules. So each script needs the sys.path lines before its own imports, and
# that is not a sortable import block.
"src/collect/*.py" = ["E402"]
"src/clean/*.py" = ["E402"]
"src/analysis/*.py" = ["E402"]
"src/models/*.py" = ["E402"]
"src/retail/*.py" = ["E402"]
"src/bigdata/*.py" = ["E402"]

[lint.isort]
known-first-party = ["src"]
